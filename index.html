<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cooling Panel</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { margin:0; height:100%; background:#d9dde0; color:#222;
    font:13px/1.3 Helvetica, Arial, sans-serif; }
  body { display:flex; flex-direction:column; }
  .bar { display:flex; align-items:stretch; background:#2d3134; border-bottom:3px solid #e8731a; }
  .bar button { border:0; border-right:1px solid #44494d; background:transparent; color:#c9cdd0;
    padding:10px 14px; font:inherit; font-size:12px; letter-spacing:.06em; text-transform:uppercase; cursor:pointer; }
  .bar button[aria-pressed="true"] { background:#e8731a; color:#fff; }
  .bar .sp { flex:1; }
  main { position:relative; flex:1; }
  #view { position:absolute; inset:0; background:#e4e7e9; touch-action:none; }
  #view canvas { display:block; width:100%; height:100%; }
  .loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#666; pointer-events:none; }
  .legend { position:absolute; top:10px; right:10px; background:#fff; border:1px solid #9aa0a5; padding:8px 10px; font-size:12px; }
  .legend h2 { margin:0 0 6px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; border-bottom:1px solid #ccc; padding-bottom:4px; }
  .legend ul { list-style:none; margin:0; padding:0; }
  .legend li { display:flex; gap:7px; align-items:center; margin:3px 0; white-space:nowrap; }
  .sw { flex:none; width:12px; height:12px; border:1px solid #555; }
  @media (max-width:600px) {
    .bar button { padding:10px 10px; font-size:11px; }
    .legend { top:auto; bottom:0; left:0; right:0; border-width:1px 0 0; padding:6px 8px; font-size:11px; }
    .legend h2 { display:none; }
    .legend ul { display:grid; grid-template-columns:1fr 1fr; column-gap:10px; }
    .legend li { margin:2px 0; }
  }
</style>
</head>
<body>
<div class="bar">
  <button id="btnMetal" aria-pressed="true">Metal roof</button>
  <button id="btnFlat" aria-pressed="false">Flat roof</button>
</div>
<main>
  <div id="view" role="img" aria-label="3D model of a house with removable bamboo cooling panels on the roof"></div>
  <div class="loading" id="loading">Loading model…</div>

  <div class="legend">
    <h2>Key</h2>
    <ul>
      <li><span class="sw" style="background:#f7f7f2"></span>Plywood, TiO2 paint</li>
      <li><span class="sw" style="background:#00d9ff"></span>Aluminium foil</li>
      <li><span class="sw" style="background:#ffd900"></span>Long rails</li>
      <li><span class="sw" style="background:#ff7f00"></span>Cross members</li>
      <li><span class="sw" style="background:#f21919"></span>Legs</li>
      <li><span class="sw" style="background:#ff00bf"></span>Hinges</li>
      <li><span class="sw" style="background:#33e519"></span>Kickstand</li>
      <li><span class="sw" style="background:#0d40ff"></span>Tie-downs</li>
      <li><span class="sw" style="background:#008c7f"></span>Roof mounting</li>
      <li id="lgSand" hidden><span class="sw" style="background:#8c19e5"></span>Sandbags</li>
      <li><span class="sw" style="background:#141414"></span>Fasteners</li>
    </ul>
  </div>

</main>


<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  const view = document.getElementById('view');
  const loading = document.getElementById('loading');
  const btnMetal = document.getElementById('btnMetal');
  const btnFlat = document.getElementById('btnFlat');
  const lgSand = document.getElementById('lgSand');

  const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  view.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xffffff, 0xb9b2a2, 1.6));
  const sun = new THREE.DirectionalLight(0xffffff, 2.2);
  sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.03;
  scene.add(sun, sun.target);

  const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 500);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.08; controls.maxPolarAngle = Math.PI * 0.495;

  const loader = new GLTFLoader();
  const cache = {};
  let current = null, inside = false, firstFrame = true;

  function loadScript(name) {
    return new Promise((ok, fail) => {
      if (window.HOUSE_MODELS && window.HOUSE_MODELS[name]) return ok();
      const el = document.createElement('script');
      el.src = 'model_' + name + '.js'; el.onload = ok; el.onerror = fail;
      document.head.appendChild(el);
    });
  }
  async function getModel(name) {
    if (cache[name]) return cache[name];
    await loadScript(name);
    const bin = atob(window.HOUSE_MODELS[name]);
    const buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    const gltf = await new Promise((ok, fail) => loader.parse(buf.buffer, '', ok, fail));
    const root = gltf.scene;
    root.traverse(o => { if (o.isMesh) { const glassy = [].concat(o.material).some(m => m.transparent); o.castShadow = !glassy; o.receiveShadow = true; } });
    cache[name] = root;
    return root;
  }
  function applyInside() {
    if (!current) return;
    current.traverse(o => {
      if (!o.isMesh) return;
      for (const m of [].concat(o.material)) {
        if (m.name && m.name.startsWith('PLYWOOD')) {
          m.transparent = inside; m.opacity = inside ? 0.12 : 1; m.depthWrite = !inside; m.needsUpdate = true;
          o.castShadow = !inside;
        }
      }
    });
  }
  function frame(root) {
    const box = new THREE.Box3().setFromObject(root);
    const c = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3());
    const r = size.length() / 2;
    sun.position.set(c.x + r, c.y + r * 2, c.z + r * 0.8); sun.target.position.copy(c);
    const sc = sun.shadow.camera; sc.left = sc.bottom = -r * 1.2; sc.right = sc.top = r * 1.2; sc.near = 0.1; sc.far = r * 6; sc.updateProjectionMatrix();
    if (firstFrame) {
      const d = r / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 0.78 * Math.max(1, 1.15 / camera.aspect);
      const dir = new THREE.Vector3(0.9, 0.8, -1.3).normalize();
      camera.position.copy(c).addScaledVector(dir, d);
      controls.target.copy(c).add(new THREE.Vector3(0, size.y * 0.15, 0));
      controls.minDistance = 0.3; controls.maxDistance = d * 3;
      firstFrame = false;
    }
    controls.update();
  }
  async function show(name) {
    const flat = name === 'flat';
    btnMetal.setAttribute('aria-pressed', String(!flat));
    btnFlat.setAttribute('aria-pressed', String(flat));
    lgSand.hidden = !flat;
    loading.hidden = false; loading.textContent = 'Loading model…';
    try {
      const root = await getModel(name);
      if (current) scene.remove(current);
      current = root; scene.add(root);
      applyInside(); frame(root);
      loading.hidden = true;
    } catch (e) {
      loading.textContent = 'The model could not load. Try refreshing the page.';
    }
  }
  function resize() {
    const w = view.clientWidth, h = view.clientHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(view); resize();
  renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });

  btnMetal.addEventListener('click', () => show('metal'));
  btnFlat.addEventListener('click', () => show('flat'));
  window.__ready = () => !loading.hidden ? false : true;
  show('metal');
</script>
</body>
</html>
